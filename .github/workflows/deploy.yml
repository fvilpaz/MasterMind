name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

# Si llegan dos pushes seguidos, el segundo despliegue espera al primero en vez de
# chocar con él (el 27-sep chocaron: "Conflict for resource mastermind-trainer").
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: mastermind-trainer
          region: europe-west1
          source: .
